<style>
*{box-sizing:border-box;}
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
html, body{overflow-x:hidden; overscroll-behavior:contain;}
.view-wrap{max-width:780px;margin:0 auto;padding:18px;overflow-x:hidden;min-width:0; contain:content;}
.view-card{background:#fff;border:1px solid #e5e3f2;border-radius:18px;overflow:hidden;box-shadow:0 4px 16px rgba(127,126,253,.08);max-width:100%; contain:layout;}
html, body{overflow-x:hidden;}
img, picture, video{max-width:100%; height:auto; display:block;}
.view-wrap img{max-width:100%;}
.view-hero{position:relative;overflow:hidden;background:var(--view-hero-grad, linear-gradient(135deg, var(--view-accent,#7f7efd) 0%, #fff 100%));}
.view-hero-bg{position:absolute;right:0;top:0;bottom:0;width:46%;opacity:0.18;overflow:hidden;}
.view-hero-bg img{width:100%;height:100%;object-fit:cover;object-position:center top;}
.view-hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg, var(--view-accent,#7f7efd) 0%, transparent 62%);}
.view-hero-inner{position:relative;padding:18px 16px;display:flex;align-items:center;gap:14px;}
.view-icon{width:68px;height:68px;border-radius:50%;background:#fff;border:3px solid rgba(255,255,255,.9);display:grid;place-items:center;overflow:hidden;flex-shrink:0;box-shadow:0 4px 12px rgba(0,0,0,.12);}
.view-icon img{width:100%;height:100%;object-fit:cover;}
.view-name{font-weight:800;font-size:20px;line-height:1.1;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.18);}
.view-title{font-size:11px;color:rgba(255,255,255,.92);font-weight:700;margin-top:2px;}
.view-ultimate{margin-left:auto;background:#fff;color:var(--view-accent,#7f7efd);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.12);flex-shrink:0;}
.view-badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.view-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.92);color:#222;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:700;}
.view-badge.birthday{background:#fff;border:1px solid #e5e3f2;}
.view-hero-sns{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;}
.view-hero-sns a{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.6);text-decoration:none;font-size:12.5px;font-weight:700;color:#222;box-shadow:0 2px 8px rgba(0,0,0,.1);}
.view-hero-sns a:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.12);}
.view-hero-sns a svg{width:14px;height:14px;flex-shrink:0;}
.view-sns{padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #e5e3f2;background:#f7f5ff;}
.view-sns a{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid #e5e3f2;text-decoration:none;font-size:12px;font-weight:700;color:#222;transition:.12s;}
.view-sns a:hover{border-color:var(--view-accent,#7f7efd);transform:translateY(-1px);box-shadow:0 2px 8px rgba(0,0,0,.06);}
.view-sns a svg{width:14px;height:14px;flex-shrink:0;}
.view-body{padding:16px;display:grid;gap:14px;}
.view-section{border:1px solid #e5e3f2;border-radius:14px;padding:12px;background:#fff;}
.view-section h3{font-size:13px;font-weight:800;margin-bottom:8px;display:flex;align-items:center;gap:6px;color:#222;}
.view-section h3 svg{color:var(--view-accent,#7f7efd);}
.view-oshi-grid{display:grid;grid-template-columns:80px minmax(0,1fr);gap:12px;align-items:center;}
.view-oshi-img{width:80px;height:80px;border-radius:14px;overflow:hidden;border:1px solid #e5e3f2;background:#f7f5ff;}
.view-oshi-img img{width:100%;height:100%;object-fit:cover;}
.view-media{display:grid;grid-template-columns:repeat(auto-fill, minmax(min(180px,100%),1fr));gap:14px;min-width:0; contain:layout;}
.view-media-item{background:rgba(255,255,255,0.94);border:3px solid #fff;outline:2px solid rgba(0,0,0,.12);border-radius:16px;overflow:hidden;box-shadow:0 6px 0 rgba(90,75,55,.06), 0 10px 24px rgba(90,75,55,.10);display:flex;flex-direction:column;transition:.14s;min-width:0;max-width:100%; contain:layout;}
.view-media-item .goods-tile{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:16/9;border-radius:12px;border:3px solid #fff;outline:2px solid rgba(0,0,0,.06);background:linear-gradient(160deg, color-mix(in srgb, var(--view-accent) 24%, #fff), color-mix(in srgb, var(--view-accent) 9%, #fff));overflow:hidden;margin:4px 4px 0;min-width:0; contain:layout;}
.view-media-item .goods-tile img{width:100%;height:100%;max-width:100%;min-width:0;object-fit:cover;display:block;border-radius:inherit;}
.view-media-meta{padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:4px;font-size:12px;}
a:hover .view-media-item{border-color:#fff;outline-color:var(--view-accent);transform:translateY(-2px);box-shadow:0 8px 0 rgba(90,75,55,.06), 0 14px 28px rgba(90,75,55,.14);}
@media(max-width:640px){
  .view-media{grid-template-columns:repeat(2, minmax(0,1fr));gap:10px;}
}
.view-gallery{display:grid;grid-template-columns:repeat(2, minmax(0,1fr));gap:8px;min-width:0; contain:layout;}
@media(min-width:560px){ .view-gallery{grid-template-columns:repeat(3, minmax(0,1fr));} }
.view-gallery-item{border:1px solid #e5e3f2;border-radius:12px;overflow:hidden;background:#fff;min-width:0;max-width:100%; contain:layout;}
.view-gallery-item img{width:100%;max-width:100%;min-width:0;aspect-ratio:4/3;object-fit:cover;display:block;}
.view-gallery-cap{padding:6px 8px;font-size:11px;white-space:pre-wrap;}
.view-free{padding:12px;border:1px dashed #e5e3f2;border-radius:12px;background:#fff;white-space:pre-wrap;font-size:13px;}
.view-lightbox{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;place-items:center;z-index:80;padding:16px;}
.view-lightbox.open{display:grid;}
.view-lightbox img{max-width:92vw;max-height:88vh;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.4);}
@media(max-width:600px){
  .view-wrap{padding:12px;}
  .view-hero-inner{flex-wrap:wrap;padding:14px 12px;gap:10px;align-items:flex-start;}
  .view-icon{width:56px;height:56px;}
  .view-name{font-size:18px;}
  .view-hero-bg{width:58%;opacity:0.16;}
  .view-hero-sns{gap:5px;}
  .view-hero-sns a{padding:5px 10px;font-size:11px;}
  .view-hero-sns a svg{width:12px;height:12px;}
  .view-oshi-grid{grid-template-columns:minmax(0,1fr);}
  .view-oshi-img{width:100%;height:180px;min-width:0;}
  .view-gallery{grid-template-columns:repeat(2, minmax(0,1fr));}
}
@media(max-width:400px){
  .view-hero-inner{padding:12px;}
  .view-card{border-radius:14px;}
  .view-body{padding:12px;}
  .view-gallery{grid-template-columns:minmax(0,1fr);}
  .view-hero-sns a{padding:4px 8px;font-size:10.5px;}
}
</style>

<script>
function getParam(n){ return new URLSearchParams(location.search).get(n); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function iconHtml(icon){
  if(!icon) return '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7f7efd" stroke-width="1.6"><circle cx="12" cy="8" r="3"/><path d="M16 17c0-2.2-1.8-4-4-4s-4 1.8-4 4"/></svg>';
  if(icon.startsWith("http")||icon.startsWith("data:")) return `<img src="${icon.replace(/"/g,'&quot;')}" alt="">`;
  return `<span style="font-size:18px;">${esc(icon.slice(0,2))}</span>`;
}
function openLightbox(url){
  const lb=document.getElementById("lightbox"); const im=document.getElementById("lightboxImg");
  if(lb&&im){ im.src=url; lb.classList.add("open"); }
}
function lightenColor(hex, amt){
  try{
    let h=hex.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join("");
    const n=parseInt(h,16); const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    const nr=Math.round(r + (255-r)*amt), ng=Math.round(g + (255-g)*amt), nb=Math.round(b + (255-b)*amt);
    return `rgb(${nr},${ng},${nb})`;
  }catch(e){ return "#fff"; }
}
async function fetchOembed(url){
  try{
    const r=await fetch(`https://noembed.com/embed?url=${encodeURIComponent(url)}`);
    if(!r.ok) return null;
    const j=await r.json();
    if(j.title) return j;
  }catch(e){}
  return null;
}
async function load(){
  const uid=getParam("uid")||getParam("u")||getParam("id");
  const root=document.getElementById("viewRoot");
  let data=null;
  let isLocal=false;
  if(uid){
    try{
      const snap=await firebase.database().ref(`millipro/linker/${uid}`).once("value");
      data=snap.val();
    }catch(e){}
  }
  if(!data){
    // fallback to local draft
    try{
      const raw=localStorage.getItem("milli-linker-draft");
      if(raw) { data=JSON.parse(raw); isLocal=true; }
    }catch(e){}
  }
  if(!data){
    root.innerHTML='<p style="text-align:center;color:#c0392b;padding:40px;">'+ (typeof T==="function"?T("view.notFoundHtml"):"プロフィールが見つかりませんでした。<br><a href=\"./\">作成する</a>") +'</p>';
    return;
  }
  const ultimate=data.ultimate||data.ultimateOshi||"";
  const mUltimate=(typeof LINKER_MEMBERS!=="undefined"?LINKER_MEMBERS.find(x=>x.id===ultimate):null) || (typeof MEMBERS!=="undefined"?MEMBERS.find(x=>x.id===ultimate):null);
  const color=mUltimate?mUltimate.color:"#7f7efd";
  const subColor=mUltimate? (mUltimate.subColor||"#e5e3f2") : "#e5e3f2";
  document.documentElement.style.setProperty("--view-accent",color);
  // ヘッダーはタレント色を基調に明度を変えたグラデ（青固定なし）
  const lightColor = (subColor && subColor !== "#e5e3f2" && subColor !== color) ? subColor : lightenColor(color, 0.78);
  const heroGrad = `linear-gradient(135deg, ${color} 0%, ${lightColor} 58%, #ffffff 100%)`;
  document.documentElement.style.setProperty("--view-hero-grad", heroGrad);
  // update og
  document.querySelector('meta[property="og:title"]').setAttribute("content", `${data.name||(typeof T==="function"?T("view.anonymous"):"名刺")} — ${mUltimate?mUltimate.name:""} | Milli Linker`);
  // SNS — Xを統合してアイコン表示
  function snsIcon(type){
    const map={x:"icon-x",youtube:"icon-youtube",discord:"icon-discord",instagram:"icon-instagram",tiktok:"icon-tiktok",line:"icon-line",wick:"icon-wick"};
    if(type==="wick") return `<img src="../images/sites/wick-icon.png" alt="" width="14" height="14" style="width:14px;height:14px;object-fit:contain;border-radius:3px">`;
    const id=map[type]||"icon-link";
    return `<svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#${id}"/></svg>`;
  }
  function isValidXHandleView(h){ return /^[A-Za-z0-9_]{1,15}$/.test(h); }
  function normalizeSnsUrl(type, raw){
    raw=(raw||"").trim(); if(!raw) return "";
    if(/^https?:\/\//.test(raw)){
      if(type==="x"){
        try{ const u=new URL(raw); const hd=u.pathname.split("/")[1]||""; if(!isValidXHandleView(hd)) return ""; }catch(e){ return ""; }
      }
      return raw;
    }
    if(type==="x"){
      const hd=raw.replace(/^@/,"").split("/")[0];
      if(!isValidXHandleView(hd)) return "";
      return `https://x.com/${hd}`;
    }
    if(type==="discord"){
      if(raw.startsWith("@")) return `https://discord.com/users/${encodeURIComponent(raw.slice(1))}`;
      if(/^\d{17,20}$/.test(raw)) return `https://discord.com/users/${raw}`;
      if(raw.includes("discord.gg/")) return `https://${raw.replace(/^https?:\/\//,"")}`;
      return `https://discord.com/users/${encodeURIComponent(raw)}`;
    }
    if(type==="youtube"){
      if(/^[A-Za-z0-9_-]{11}$/.test(raw)) return `https://www.youtube.com/watch?v=${raw}`;
      if(raw.startsWith("@")) return `https://www.youtube.com/${raw}`;
      return `https://${raw.replace(/^https?:\/\//,"")}`;
    }
    if(type==="instagram") return raw.startsWith("@")?`https://www.instagram.com/${raw.slice(1)}`: (raw.includes("instagram.com")?`https://${raw.replace(/^https?:\/\//,"")}`:`https://www.instagram.com/${encodeURIComponent(raw)}`);
    if(type==="tiktok") return raw.startsWith("@")?`https://www.tiktok.com/${raw}`: (raw.includes("tiktok.com")?`https://${raw.replace(/^https?:\/\//,"")}`:`https://www.tiktok.com/${encodeURIComponent(raw)}`);
    if(type==="line") return raw.includes("line.me")?`https://${raw.replace(/^https?:\/\//,"")}`:raw;
    return raw;
  }
  let snsList=(data.sns||[]).filter(s=>s.type&&s.url).map(s=> ({type:s.type, url:normalizeSnsUrl(s.type,s.url), memo:s.memo||"", label: (s.type==="x"?"X": s.type==="youtube"?"YouTube": s.type.charAt(0).toUpperCase()+s.type.slice(1)) }));
  // xUrlを先頭に追加（重複回避）
  if(data.xUrl){
    const xNorm=normalizeSnsUrl("x", data.xUrl);
    if(!snsList.some(s=>s.type==="x" && s.url===xNorm)){
      snsList.unshift({type:"x", url:xNorm, memo:"", label:"X"});
    }
  }
  const snsHtml=snsList.map(s=>{
    const icon=snsIcon(s.type);
    return `<a href="${s.url}" target="_blank" rel="noopener" title="${esc(s.memo||s.label)}">${icon}${esc(s.label)}${s.memo?`<span style="font-weight:400;color:#8a86a3;">${esc(s.memo)}</span>`:""}</a>`;
  }).join("");
  const favs=(data.favs||[]).map(id=>{
    const m=LINKER_MEMBERS.find(x=>x.id===id)||MEMBERS.find(x=>x.id===id);
    return m?m.name:id;
  }).join(" / ");
  const kamiRows=data.kamiRows|| (data.kamiUrl?[{url:data.kamiUrl,start:data.kamiStart,comment:data.kamiComment}]:[]);
  const songRows=data.songRows|| (data.songUrl?[{url:data.songUrl,comment:data.songComment||""}]:[]);
  const galleryRows=data.gallery||[];
  // birthday — SVG icon
  let birthdayHtml="";
  if(data.birthday && data.birthdayPublic!=="hidden"){
    const mm=data.birthday.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(mm){
      const txt=data.birthdayPublic==="full"?`${mm[1]}/${mm[2]}/${mm[3]}`:`${mm[2]}/${mm[3]}`;
      birthdayHtml=`<span class="view-badge birthday"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-birthday"/></svg> ${esc(txt)}</span>`;
    }
  }
  const GROUP_MEMBERS_VIEW={nova:["raco","yura","nuhu","aoi"], uni:["tsukuri","liz","rei"], sona:["nono","akubi","mahoro"]};
  const isGroupView=!!GROUP_MEMBERS_VIEW[ultimate];
  const talentImg=mUltimate? (mUltimate.img? (mUltimate.img.startsWith("http")?mUltimate.img:"../"+mUltimate.img) : "") : "";
  const talentLogo=mUltimate? (mUltimate.logo? (mUltimate.logo.startsWith("http")?mUltimate.logo:"../"+mUltimate.logo) : "") : "";
  root.innerHTML=`
    <div class="view-card" style="border-top:4px solid ${color}">
      <div class="view-hero">
        ${talentImg?`<div class="view-hero-bg"><img src="${talentImg}" alt="" loading="eager" fetchpriority="high" decoding="async" onerror="this.style.display='none'"></div>`:""}
        <div class="view-hero-inner">
          <span class="view-icon">${iconHtml(data.icon)}</span>
          <div style="display:flex;flex-direction:column;gap:6px;flex:1;min-width:0;">
            <span style="display:flex;flex-direction:column;line-height:1.15;">
              <span class="view-name">${esc(data.name||(typeof T==="function"?T("view.anonymous"):"名無し"))}</span>
              ${data.title?`<span class="view-title">${esc(data.title)}</span>`:""}
              <span class="view-badges">${mUltimate?`<span class="view-badge" style="background:${color};color:#fff;">${typeof T==="function"?T("view.mostOshiFull",{name:esc(mUltimate.name)}):`最推し ${esc(mUltimate.name)}`}</span>`:""}${birthdayHtml}</span>
            </span>
            ${snsList.length?`<div class="view-hero-sns">${snsHtml}</div>`:""}
          </div>
          ${talentLogo?`<img src="${talentLogo}" alt="${esc(mUltimate.name)}" style="margin-left:auto;width:84px;height:36px;object-fit:contain;background:rgba(255,255,255,.9);padding:4px 8px;border-radius:10px;flex-shrink:0;align-self:flex-start;" onerror="this.style.display='none'">`:""}
        </div>
      </div>
      <div class="view-body">
        ${mUltimate?`<div class="view-section"><h3><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l2.4 4.8L20 8l-4 3.9.9 5.1L12 14.8 7.1 17l.9-5.1L4 8l5.6-1.2z"/></svg> ${typeof T==="function"?T("view.section.oshi"):"推し"}</h3>
          <div class="view-oshi-grid">
            ${isGroupView?`<div style="display:flex;gap:4px;align-items:end;flex-wrap:wrap;">${GROUP_MEMBERS_VIEW[ultimate].map(id=>{ const mm=(typeof LINKER_MEMBERS!=="undefined"?LINKER_MEMBERS.find(x=>x.id===id):null)||(typeof MEMBERS!=="undefined"?MEMBERS.find(x=>x.id===id):null); const img=mm&&mm.img ? (mm.img.startsWith("http")?mm.img:"../"+mm.img) : ""; const name=mm?mm.name:id; return `<div class="view-oshi-img" style="width:64px;height:64px;"><img src="${img}" alt="${esc(name)}" onerror="this.parentElement.style.display='none'"></div>`; }).join("")}</div>` : (talentImg?`<div class="view-oshi-img"><img src="${talentImg}" alt="${esc(mUltimate.name)}" onerror="this.parentElement.style.display='none'"></div>`:`<div></div>`)}
            <div>
              <div style="font-size:14px;color:#6b6a7a;line-height:1.6;">${typeof T==="function"?T("view.mostOshi"):"最推し"}: <b style="color:${color};font-size:16px;">${esc(mUltimate.name)}</b> <span style="font-size:12px;">${esc(mUltimate.gen||"")}</span></div>
              ${favs?`<div style="font-size:12px;color:#6b6a7a;margin-top:4px;">${typeof T==="function"?T("view.otherOshi"):"他推し"}: ${esc(favs)}</div>`:""}
              <div style="font-size:12px;color:#6b6a7a;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;">
                ${data.oshiHistory?`<span style="background:#f7f5ff;border:1px solid #e5e3f2;padding:2px 8px;border-radius:999px;">${typeof T==="function"?T("view.oshiHistory"):"推し歴"} ${esc(data.oshiHistory)}</span>`:""}
                ${data.oshiMark?`<span style="background:${color};color:#fff;padding:2px 8px;border-radius:999px;">${esc(data.oshiMark)}</span>`:""}
                ${birthdayHtml?birthdayHtml.replace('view-badge birthday','view-badge').replace('🎂 ',''):""}
              </div>
              ${mUltimate.fanName?`<div style="font-size:11px;color:#6b6a7a;margin-top:6px;">${typeof T==="function"?T("view.fanName"):"ファンネーム"}: ${esc(mUltimate.fanName)}</div>`:""}
            </div>
          </div>
        </div>`:""}
        ${galleryRows.length?`<div class="view-section"><h3><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg> ${typeof T==="function"?T("view.section.gallery"):"画像ギャラリー"}</h3><div class="view-gallery">${galleryRows.map(g=>{
          const cap=esc(g.comment||"");
          return `<div class="view-gallery-item"><img src="${g.url}" alt="" loading="lazy" onclick="openLightbox('${g.url.replace(/'/g,"\\'")}')">${cap?`<div class="view-gallery-cap">${cap}</div>`:""}</div>`;
        }).join("")}</div></div>`:""}
        ${kamiRows.length?`<div class="view-section"><h3><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M15 10l4.55-2.28a1 1 0 0 1 1.45.9v8.76a1 1 0 0 1-1.45.9L15 16"/><rect x="1" y="6" width="14" height="12" rx="2"/></svg> ${typeof T==="function"?T("view.section.kami"):"神回（好きな動画）"}</h3><div class="view-media">${kamiRows.map(r=>{
          const id=(r.url.match(/v=([A-Za-z0-9_-]{11})/)||[])[1]|| (r.url.match(/youtu\.be\/([A-Za-z0-9_-]{11})/)||[])[1] || "";
          const thumb=id?`https://img.youtube.com/vi/${id}/mqdefault.jpg`:"";
          const unishareUrl=id?`https://milli-unishare.pages.dev/?v=${id}${r.start?`&t=${encodeURIComponent(r.start)}`:""}#watch=${id}`:r.url;
          const title=esc(r.title||"神回");
          return `<a href="${unishareUrl}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;display:block;"><div class="view-media-item"><div class="goods-tile">${thumb?`<img src="${thumb}" alt="" loading="lazy">`:`<div style="width:100%;height:100%;display:grid;place-items:center;background:#fff;font-size:11px;color:#6b6a7a;">${typeof T==="function"?T("view.noImage"):"No Image"}</div>`}</div><div class="view-media-meta"><div style="font-weight:800;font-size:0.92rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${title}${r.start?` <span style="font-size:0.82rem;color:var(--muted);">· ${esc(r.start)}秒</span>`:""}</div>${r.comment?`<div style="font-size:0.85rem;color:var(--muted);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${esc(r.comment)}</div>`:""}<div style="font-size:0.82rem;color:var(--view-accent);font-weight:800;margin-top:4px;">${typeof T==="function"?T("view.unishare"):"Unishareで見る →"}</div></div></div></a>`;
        }).join("")}</div></div>`:""}
        ${songRows.length?`<div class="view-section"><h3><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg> ${typeof T==="function"?T("view.section.song"):"好きな曲"}</h3><div class="view-media">${songRows.map(r=>{
          const id=(r.url.match(/v=([A-Za-z0-9_-]{11})/)||[])[1]|| (r.url.match(/youtu\.be\/([A-Za-z0-9_-]{11})/)||[])[1] || "";
          const thumb=id?`https://img.youtube.com/vi/${id}/mqdefault.jpg`:"";
          const millivibeUrl=id?`https://milli-unishare.pages.dev/millivibe.html?v=${id}`:r.url;
          const title=esc(r.title||r.id||"曲");
          return `<a href="${millivibeUrl}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;display:block;"><div class="view-media-item"><div class="goods-tile">${thumb?`<img src="${thumb}" alt="" loading="lazy">`:`<div style="width:100%;height:100%;display:grid;place-items:center;background:#fff;font-size:11px;color:#6b6a7a;">${typeof T==="function"?T("view.noImage"):"No Image"}</div>`}</div><div class="view-media-meta"><div style="font-weight:800;font-size:0.92rem;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${title}</div>${r.comment?`<div style="font-size:0.85rem;color:var(--muted);margin-top:2px;">${esc(r.comment)}</div>`:""}<div style="font-size:0.82rem;color:var(--view-accent);font-weight:800;margin-top:4px;">${typeof T==="function"?T("view.millivibe"):"Millivibeで見る →"}</div></div></div></a>`;
        }).join("")}</div></div>`:""}
        ${data.free?`<div class="view-section"><h3><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg> ${typeof T==="function"?T("view.section.free"):"フリースペース"}</h3><div class="view-free">${esc(data.free)}</div></div>`:""}
        <div class="view-section" style="background:#f7f5ff;text-align:center;">
          <div style="font-size:12px;color:#6b6a7a;">${typeof T==="function"?T("view.section.share"):"この名刺をシェア"}</div>
          <div style="margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;">
            <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(`[${data.name||""}のMilli Linker名刺 — 最推し ${mUltimate?mUltimate.name:""}] #ミリプロ好きと繋がりたい #MilliKit #MilliLinker`)}&url=${encodeURIComponent(location.href)}" target="_blank" rel="noopener" style="padding:8px 14px;border-radius:999px;background:${color};color:#fff;text-decoration:none;font-weight:800;font-size:12px;">${typeof T==="function"?T("view.share.x"):"Xで共有"}</a>
            <button onclick="navigator.clipboard.writeText(location.href).then(()=>alert(typeof T==="function"?T("view.share.copied"):"コピーしました"))" style="padding:8px 14px;border-radius:999px;border:1px solid #e5e3f2;background:#fff;font-weight:700;font-size:12px;">${typeof T==="function"?T("view.share.copy"):"リンクをコピー"}</button>
          </div>
          <div style="margin-top:10px;padding:10px;background:#fff8cc;border:1px solid #f7d640;border-radius:12px;display:flex;gap:8px;align-items:flex-start;text-align:left;">
            <span style="font-size:16px;flex-shrink:0;">⚠️</span>
            <div style="font-size:12px;line-height:1.6;color:#5a4a00;">
              <b>${typeof T==="function"?T("view.share.warningTitle"):"X投稿時の注意"}</b><br>
              ${typeof T==="function"?T("view.share.warningDescHtml"):"Xの仕様上、画像や引用を同時に付けると名刺（OGP）が正しく表示されません。<br>まずは<b>「文字＋リンク」のみ</b>で投稿してください。<br>画像や引用を付けたい場合は、その投稿への<b>リプライや引用リポスト</b>で追加してください。"}
            </div>
          </div>
          <div style="margin-top:12px;"><img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(location.href)}" alt="QR" width="160" height="160" style="border:1px solid #e5e3f2;border-radius:12px;background:#fff;padding:6px;"></div>
          <div style="font-size:11px;color:#6b6a7a;margin-top:6px;word-break:break-all;">${esc(location.href)}</div>
        </div>
      </div>
    </div>
    <div id="lightbox" class="view-lightbox" onclick="this.classList.remove('open')"><img id="lightboxImg" alt=""></div>
    <p style="text-align:center;margin-top:12px;"><a href="../mypage.html" style="color:${color};font-weight:700;">${typeof T==="function"?T("view.mypageLink"):"マイページで見る"}</a></p>
  `;
  // viewer color theming — if viewer has ultimate, dye background lightly
  try{
    const raw=localStorage.getItem("millipro_userdata");
    if(raw){
      const ud=JSON.parse(raw);
      const viewerUlt=ud.ultimateOshi;
      const vm=(LINKER_MEMBERS.find(x=>x.id===viewerUlt)||MEMBERS.find(x=>x.id===viewerUlt));
      if(vm) document.body.style.background=`linear-gradient(180deg, ${vm.color}12 0%, #fff 40%)`;
    }
  }catch(e){}
}
document.addEventListener("DOMContentLoaded", load);
</script>
</body>
