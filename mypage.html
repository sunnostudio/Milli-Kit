<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>マイページ | Milli Kit</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="images/icon/192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="images/icon/apple-touch-icon.png">
<link rel="stylesheet" href="kit.css">
<style>
.mypage-wrap{max-width:760px;margin:0 auto;padding:18px;display:grid;gap:16px;}
.mypage-card{background:#fff;border:1px solid #e5e3f2;border-radius:18px;padding:16px;box-shadow:0 4px 16px rgba(127,126,253,.06);}
.mypage-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.mypage-section{background:#fff;border:1px solid #e5e3f2;border-radius:16px;padding:14px;}
.mypage-section h3{font-size:13px;font-weight:800;display:flex;align-items:center;gap:6px;margin-bottom:8px;}
.mypage-grid{display:grid;gap:10px;}
@media(min-width:600px){ .mypage-grid{grid-template-columns:1fr 1fr;} }
.mypage-item{border:1px solid #e5e3f2;border-radius:14px;padding:12px;background:#f7f5ff;display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;transition:.14s;}
.mypage-item:hover{border-color:var(--official-accent, #7f7efd);background:#fff;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.06);}
.mypage-item-icon{width:36px;height:36px;border-radius:10px;background:#fff;border:1px solid #e5e3f2;display:grid;place-items:center;flex-shrink:0;}
.mypage-item-title{font-weight:800;font-size:13px;}
.mypage-item-desc{font-size:11px;color:#6b6a7a;}
</style>
</head>
<body>
<div class="kit-bg-curves" aria-hidden="true">
  <svg viewBox="0 0 1200 820" preserveAspectRatio="none" width="100%" height="100%">
    <path d="M -80 110 C 220 20, 580 240, 1280 90" fill="none" stroke="#5f97a4" stroke-width="1.95" stroke-linecap="round" opacity="0.16"/>
    <path d="M -80 310 C 380 140, 740 460, 1280 300" fill="none" stroke="#cba60b" stroke-width="2.00" stroke-linecap="round" opacity="0.16"/>
    <path d="M -80 575 C 460 360, 860 700, 1280 560" fill="none" stroke="#EF454A" stroke-width="2.05" stroke-linecap="round" opacity="0.15"/>
  </svg>
</div>
<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
  <symbol id="icon-user" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M16 17c0-2.2-1.8-4-4-4s-4 1.8-4 4"/><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="icon-link" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M9.8 14.2a3.6 3.6 0 0 1 0-5.1l1.1-1.1a3.6 3.6 0 0 1 5.1 0 3.6 3.6 0 0 1 0 5.1l-.7.7"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M14.2 9.8a3.6 3.6 0 0 1 0 5.1l-1.1 1.1a3.6 3.6 0 0 1-5.1 0 3.6 3.6 0 0 1 0-5.1l.7-.7"/></symbol>
  <symbol id="icon-edit" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 20h9"/><path fill="none" stroke="currentColor" stroke-width="1.7" d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></symbol>
  <symbol id="icon-eye" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
  <symbol id="icon-x" viewBox="0 0 24 24"><path fill="currentColor" d="M18.9 2.1h2.9L14.6 10l8.4 11.9h-6.6l-5.2-7.4-5.9 7.4H2.4l7.7-8.7L2.1 2.1h6.8l4.7 6.6 5.3-6.6z"/></symbol>
</svg>
<header id="kitHeader">
  <div class="header-inner">
    <a class="kit-logo" href="./" aria-label="Milli Kit トップ">
      <img src="images/rogo/milli-kit-rogo.png" alt="Milli Kit" width="1526" height="424" style="height:32px;width:auto;display:block;object-fit:contain;">
    </a>
    <nav class="kit-nav" aria-label="メインナビゲーション">
      <a href="./#tools">ツール</a>
      <a href="linker/" style="background:var(--accent-soft);border:1px solid var(--accent);border-radius:999px;">Milli Linker</a>
      <a href="mypage.html" style="background:var(--accent);color:#fff;border-radius:999px;">マイページ</a>
    </nav>
    <div class="header-actions">
      <button id="profileBtn" class="profile-btn" onclick="if(typeof kitOpenAccount==='function')kitOpenAccount();else if(typeof mpOpen==='function')mpOpen();" aria-label="アカウント">
        <span id="profileIcon" class="profile-icon" aria-hidden="true"><svg width="18" height="18" aria-hidden="true"><use href="#icon-user"/></svg></span>
        <span id="profileLabel" class="profile-label">ログイン</span>
      </button>
      <button id="hamburger" class="hamburger" aria-label="メニュー" aria-expanded="false" aria-controls="mobileNav"><span></span><span></span><span></span></button>
    </div>
  </div>
  <nav id="mobileNav" class="mobile-nav" aria-hidden="true">
    <a href="./#tools">ツール一覧</a>
    <a href="linker/">Milli Linker</a>
    <a href="mypage.html">マイページ</a>
    <a href="https://milli-orbis-portal.pages.dev/" target="_blank" rel="noopener">Milli Orbis</a>
    <a href="https://milli-unishare.pages.dev/" target="_blank" rel="noopener">Milli Unishare</a>
  </nav>
  <div id="drawerBackdrop" class="drawer-backdrop" aria-hidden="true"></div>
</header>
<main class="mypage-wrap">
  <div id="mypageRoot"><p style="text-align:center;color:#6b6a7a;padding:40px;">読み込み中…</p></div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="firebase-init.js"></script>
<script src="data/members.js"></script>
<script src="data.js"></script>
<script>
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function load(){
  const root=document.getElementById("mypageRoot");
  // try firebase first
  let uid=null;
  try{
    if(typeof firebase!=="undefined" && firebase.auth().currentUser) uid=firebase.auth().currentUser.uid;
    else {
      // wait for auth
      await new Promise(res=>{
        if(typeof onMilliproAuth==="function") onMilliproAuth(u=>{ uid=u; res(); });
        else res();
      });
      if(!uid && typeof firebase!=="undefined" && firebase.auth().currentUser) uid=firebase.auth().currentUser.uid;
    }
  }catch(e){}
  let data=null;
  let link="";
  if(uid){
    try{
      const snap=await firebase.database().ref(`millipro/linker/${uid}`).once("value");
      data=snap.val();
      if(data) link=`${location.origin}/linker/view.html?uid=${uid}`;
    }catch(e){}
  }
  if(!data){
    try{
      const raw=localStorage.getItem("milli-linker-draft");
      if(raw){ data=JSON.parse(raw); link=location.origin+"/linker/view.html?local=1"; }
    }catch(e){}
  }
  if(!data){
    root.innerHTML=`<div class="mypage-card"><p>まだ名刺がありません。</p><div class="mypage-actions"><a href="linker/" class="kit-btn primary">作成する</a></div></div>`;
    return;
  }
  const name=data.name||"名無し";
  const ultimate=data.ultimate||data.ultimateOshi||"";
  const m= (typeof LINKER_MEMBERS!=="undefined"?LINKER_MEMBERS.find(x=>x.id===ultimate):null) || (typeof MEMBERS!=="undefined"?MEMBERS.find(x=>x.id===ultimate):null);
  const color=m?m.color:"#7f7efd";
  root.innerHTML=`
    <div class="mypage-card" style="border-top:4px solid ${color}">
      <div style="display:flex;align-items:center;gap:12px;">
        <span style="width:56px;height:56px;border-radius:50%;background:#fff;border:1px solid #e5e3f2;display:grid;place-items:center;overflow:hidden;">${data.icon && (data.icon.startsWith("http")||data.icon.startsWith("data:"))?`<img src="${data.icon.replace(/"/g,'&quot;')}" style="width:100%;height:100%;object-fit:cover">`:`<span>${esc((data.icon||name).slice(0,2))}</span>`}</span>
        <div><div style="font-weight:800;font-size:16px;">${esc(name)} ${data.title?`<span style="font-size:11px;color:#6b6a7a;font-weight:700;">${esc(data.title)}</span>`:""}</div><div style="font-size:13px;color:#6b6a7a;">${m?`最推し ${esc(m.name)}`:""}</div></div>
        <span style="margin-left:auto;background:${color};color:#fff;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:800;">${m?esc(m.name):""}</span>
      </div>
    </div>
    <div class="mypage-section">
      <h3><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg> 名刺を管理</h3>
      <div class="mypage-grid">
        <a href="linker/" class="mypage-item"><span class="mypage-item-icon"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-edit"/></svg></span><span><span class="mypage-item-title">編集する</span><br><span class="mypage-item-desc">内容を変更</span></span></a>
        ${link?`<a href="${link}" target="_blank" rel="noopener" class="mypage-item"><span class="mypage-item-icon"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-eye"/></svg></span><span><span class="mypage-item-title">プロフィールを表示</span><br><span class="mypage-item-desc">公開ページを開く</span></span></a>`:`<span class="mypage-item" style="opacity:.6"><span class="mypage-item-icon"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-eye"/></svg></span><span><span class="mypage-item-title">未公開</span><br><span class="mypage-item-desc">公開後に表示</span></span></span>`}
        <a href="https://twitter.com/intent/tweet?text=${encodeURIComponent(`${name}のMilli Linker名刺 — 最推し ${m?m.name:""} #ミリプロ #MilliKit #MilliLinker`)}&url=${encodeURIComponent(link||location.href)}" target="_blank" rel="noopener" class="mypage-item" style="background:${color}14;border-color:${color}"><span class="mypage-item-icon" style="background:${color};color:#fff;border-color:${color}"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-x"/></svg></span><span><span class="mypage-item-title">Xで共有</span><br><span class="mypage-item-desc">ポストを作成</span></span></a>
      </div>
    </div>
    ${link?`<div class="mypage-section">
      <h3><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg> 共有</h3>
      <div style="display:flex;gap:8px;align-items:center;background:#f7f5ff;border:1px solid #e5e3f2;border-radius:12px;padding:10px;">
        <span style="flex:1;font-size:12px;word-break:break-all;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${link}</span>
        <button onclick="navigator.clipboard.writeText('${link}').then(()=>{this.textContent='コピーしました';setTimeout(()=>this.textContent='コピー',1500)})" style="flex-shrink:0;padding:6px 12px;border-radius:999px;border:1px solid #e5e3f2;background:#fff;font-weight:700;font-size:11px;white-space:nowrap;">コピー</button>
        <a href="${link}" target="_blank" rel="noopener" style="flex-shrink:0;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid #e5e3f2;text-decoration:none;font-weight:700;font-size:11px;white-space:nowrap;">開く</a>
      </div>
      <div style="margin-top:12px;text-align:center;"><img src="https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(link)}" alt="QR" width="160" height="160" style="border:1px solid #e5e3f2;border-radius:12px;background:#fff;padding:6px;"><div style="font-size:11px;color:#6b6a7a;margin-top:4px;">QRコード</div></div>
    </div>`:""}
    <details style="font-size:11px;color:#6b6a7a;background:#fff;border:1px dashed #e5e3f2;border-radius:12px;padding:10px;"><summary style="cursor:pointer;font-weight:700;">OGP画像について</summary><p style="margin-top:6px;word-break:break-all;">OGPは <code>https://milli-unishare-og.onrender.com/cardOgp?uid=${uid||"local"}</code> で生成されます。Xに貼ると名刺が大きく表示されます。</p></details>
  `;
}
document.addEventListener("DOMContentLoaded", load);
</script>
<script src="scripts/cursor.js"></script>
<script src="kit.js"></script>
</body>
</html>
